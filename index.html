<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports TV Player</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#080b10;
    color:#fff;
    min-height:100vh;
}

header{
    padding:18px;
    text-align:center;
    background:#10151d;
    border-bottom:1px solid #202833;
}

header h1{
    font-size:24px;
}

header p{
    color:#8d98a8;
    margin-top:6px;
    font-size:13px;
}

.player-box{
    width:100%;
    max-width:1100px;
    margin:auto;
    background:#000;
}

video{
    width:100%;
    display:block;
    aspect-ratio:16/9;
    background:#000;
}

.status{
    padding:10px 15px;
    text-align:center;
    background:#10151d;
    color:#9da8b7;
    font-size:14px;
}

.search{
    max-width:900px;
    margin:18px auto 10px;
    padding:0 12px;
}

.search input{
    width:100%;
    padding:14px 18px;
    border-radius:12px;
    border:1px solid #29313c;
    outline:none;
    background:#111720;
    color:white;
    font-size:15px;
}

.channels{
    max-width:1100px;
    margin:15px auto;
    padding:0 12px 30px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:10px;
}

.channel{
    background:#111720;
    border:1px solid #202a35;
    border-radius:12px;
    padding:14px;
    cursor:pointer;
    transition:.2s;
}

.channel:hover{
    background:#18212c;
    transform:translateY(-2px);
}

.channel.active{
    border-color:#36a3ff;
    background:#172534;
}

.channel-name{
    font-size:14px;
    font-weight:bold;
    line-height:1.5;
}

.channel-group{
    margin-top:6px;
    color:#7f8b9a;
    font-size:11px;
}

.error{
    color:#ff6672;
}

@media(max-width:600px){
    header h1{
        font-size:20px;
    }

    .channels{
        grid-template-columns:1fr;
    }
}

const video = document.getElementById("video");
const channelsBox = document.getElementById("channels");
const statusBox = document.getElementById("status");
const searchBox = document.getElementById("search");

let hls = null;
let channels = [];

function parseM3U(text){

    const lines = text
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(Boolean);

    const result = [];

    for(let i = 0; i < lines.length; i++){

        if(lines[i].startsWith("#EXTINF")){

            const info = lines[i];
            const url = lines[i + 1];

            if(!url || url.startsWith("#")) continue;

            const namePart = info.substring(info.lastIndexOf(",") + 1);

            const groupMatch =
                info.match(/group-title="([^"]*)"/i);

            result.push({
                name:namePart,
                group:groupMatch ? groupMatch[1] : "",
                url:url
            });
        }
    }

    return result;
}

channels = parseM3U(M3U);

function convertToM3U8(url){

    return url.replace(
        /([?&]extension=)ts\b/i,
        "$1m3u8"
    );
}

function renderChannels(list){

    channelsBox.innerHTML = "";

    list.forEach((channel,index)=>{

        const div = document.createElement("div");

        div.className = "channel";

        div.innerHTML = `
            <div class="channel-name">
                ${escapeHTML(channel.name)}
            </div>

            <div class="channel-group">
                ${escapeHTML(channel.group)}
            </div>
        `;

        div.addEventListener("click",()=>{

            document
                .querySelectorAll(".channel")
                .forEach(x=>x.classList.remove("active"));

            div.classList.add("active");

            playChannel(channel);
        });

        channelsBox.appendChild(div);
    });
}

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function playChannel(channel){

    let url = convertToM3U8(channel.url);

    statusBox.textContent =
        "جاري تشغيل: " + channel.name;

    statusBox.classList.remove("error");

    if(hls){

        hls.destroy();
        hls = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    if(Hls.isSupported()){

        hls = new Hls({
            enableWorker:true,
            lowLatencyMode:true,
            backBufferLength:30,
            maxBufferLength:30
        });

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED,()=>{

            video.play().catch(()=>{});

            statusBox.textContent =
                "▶ " + channel.name;
        });

        hls.on(Hls.Events.ERROR,(event,data)=>{

            if(data.fatal){

                statusBox.textContent =
                    "تعذر تشغيل القناة: " + channel.name;

                statusBox.classList.add("error");

                switch(data.type){

                    case Hls.ErrorTypes.NETWORK_ERROR:

                        hls.startLoad();
                        break;

                    case Hls.ErrorTypes.MEDIA_ERROR:

                        hls.recoverMediaError();
                        break;

                    default:

                        hls.destroy();
                        hls = null;
                        break;
                }
            }
        });

    }else if(
        video.canPlayType("application/vnd.apple.mpegurl")
    ){

        video.src = url;

        video.addEventListener(
            "loadedmetadata",
            ()=>video.play().catch(()=>{}),
            {once:true}
        );

    }else{

        statusBox.textContent =
            "هذا الجهاز لا يدعم تشغيل HLS";

        statusBox.classList.add("error");
    }
}

searchBox.addEventListener("input",()=>{

    const q =
        searchBox.value
            .toLowerCase()
            .trim();

    const filtered = channels.filter(channel=>

        channel.name.toLowerCase().includes(q) ||
        channel.group.toLowerCase().includes(q)
    );

    renderChannels(filtered);
});

video.addEventListener("waiting",()=>{

    statusBox.textContent = "⏳ جاري تحميل البث...";
});

video.addEventListener("playing",()=>{

    statusBox.classList.remove("error");
});

video.addEventListener("error",()=>{

    statusBox.textContent =
        "⚠️ حدث خطأ في تشغيل البث";

    statusBox.classList.add("error");
});

renderChannels(channels);

// تشغيل Arena Sport 6 FHD تلقائياً عند فتح الصفحة
window.addEventListener("load", () => {

    const arena6 = channels.find(channel =>
        channel.name.includes("ARENA SPORT 3 FHD")
    );

    if (arena6) {
        playChannel(arena6);

        // تحديد القناة النشطة بصرياً
        const channelElements =
            document.querySelectorAll(".channel");

        const index = channels.indexOf(arena6);

        if (channelElements[index]) {
            channelElements[index].classList.add("active");
        }
    }

});

</script></body>
</html>
