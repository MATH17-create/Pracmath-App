<title>Sports Channels</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0b0d12;
    color:#fff;
    font-family:Arial, sans-serif;
}

/* ===== Header ===== */

.header{
    height:70px;
    background:#11151d;

    display:flex;
    align-items:center;

    padding:0 16px;

    position:sticky;
    top:0;
    z-index:10;

    border-bottom:1px solid #252a34;
}

.back{
    font-size:34px;
    margin-right:20px;
    color:#fff;
}

.title{
    font-size:22px;
    font-weight:bold;
    flex:1;
}

.search{
    font-size:30px;
}

/* ===== Main ===== */

.container{
    padding:14px 10px 30px;
}

/* ===== Section ===== */

.section-title{
    font-size:18px;
    font-weight:bold;

    margin:8px 4px 14px;

    color:#e8e8e8;
}

/* ===== Grid ===== */

.channels{
    display:grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:12px;
}

/* ===== Card ===== */

.channel{
    background:#171b23;

    border:1px solid #292f3a;

    border-radius:12px;

    overflow:hidden;

    text-decoration:none;

    color:#fff;

    box-shadow:
        0 4px 12px rgba(0,0,0,.35);

    transition:
        transform .15s,
        background .15s;
}

.channel:active{
    transform:scale(.96);
}

.channel:hover{
    background:#1d222c;
}

/* ===== Image ===== */

.logo-box{
    height:115px;

    background:#fff;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:12px;

    position:relative;
}

.logo-box img{
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;
}

/* ===== Number ===== */

.number{
    position:absolute;

    top:8px;
    right:8px;

    min-width:31px;
    height:31px;

    padding:0 7px;

    background:#54217d;

    border-radius:6px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;
    font-weight:bold;
}

/* ===== Channel Name ===== */

.name{
    min-height:52px;

    display:flex;
    align-items:center;

    padding:8px 10px;

    font-size:14px;

    color:#d5d8de;

    line-height:1.2;
}

/* ===== Online indicator ===== */

.online{
    width:7px;
    height:7px;

    background:#20d46b;

    border-radius:50%;

    display:inline-block;

    margin-right:6px;

    box-shadow:
        0 0 7px #20d46b;
}

/* ===== Tablet ===== */

@media (min-width:600px){

    .channels{
        grid-template-columns:
            repeat(4, 1fr);
    }

    .logo-box{
        height:140px;
    }

}

/* ===== Desktop ===== */

@media (min-width:1000px){

    .container{
        max-width:1100px;
        margin:auto;
    }

    .channels{
        grid-template-columns:
            repeat(5, 1fr);
    }

}

</style>
</head>
