/* =========================================
   تحويل extension=m3u8
   إلى extension=.m3u8
========================================= */

function fixM3U8(url){

    return url.replace(
        /([?&]extension)=m3u8\b/i,
        "$1=.m3u8"
    );

}


/* =========================================
   عناصر الصفحة
========================================= */

const video =
    document.getElementById("video");

const list =
    document.getElementById("channelList");

const channelName =
    document.getElementById("channelName");

const status =
    document.getElementById("status");

const search =
    document.getElementById("search");


/* =========================================
   إنشاء قائمة القنوات
========================================= */

function renderChannels(filter=""){

    list.innerHTML="";

    channels
    .filter(c =>
        c.name
        .toLowerCase()
        .includes(filter.toLowerCase())
    )
    .forEach((channel,index)=>{

        const button =
            document.createElement("button");

        button.className="channel";

        button.textContent=channel.name;

        button.onclick=()=>{

            playChannel(channel,index);

        };

        list.appendChild(button);

    });

}


/* =========================================
   تشغيل القناة
========================================= */

function playChannel(channel,index){

    const buttons =
        document.querySelectorAll(".channel");

    buttons.forEach(
        b=>b.classList.remove("active")
    );

    if(buttons[index]){
        buttons[index].classList.add("active");
    }

    channelName.textContent =
        channel.name;

    status.textContent =
        "جاري الاتصال بالبث...";

    /*
       هنا يتم تعديل الرابط تلقائياً
       extension=m3u8
                ↓
       extension=.m3u8
    */

    const streamURL =
        fixM3U8(channel.url);

    console.log(
        "الرابط المستخدم:",
        streamURL
    );

    video.pause();

    video.removeAttribute("src");

    video.load();


    /* =====================================
       استخدام HLS
    ===================================== */

    if(
        typeof Hls !== "undefined" &&
        Hls.isSupported()
    ){

        if(window.hlsPlayer){

            window.hlsPlayer.destroy();

        }

        window.hlsPlayer =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30

            });


        window.hlsPlayer.loadSource(
            streamURL
        );


        window.hlsPlayer.attachMedia(
            video
        );


        window.hlsPlayer.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                video.play()
                .then(()=>{

                    status.textContent =
                        "● البث يعمل";

                })
                .catch(()=>{

                    status.textContent =
                        "اضغط ▶ لتشغيل البث";

                });

            }
        );


        window.hlsPlayer.on(
            Hls.Events.ERROR,
            function(event,data){

                console.log(
                    "HLS ERROR:",
                    data
                );

                if(data.fatal){

                    status.textContent =
                        "تعذر تشغيل البث";

                }

            }
        );

    }

    /*
       Safari / iPhone وبعض المتصفحات
    */

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src=streamURL;

        video.play()
        .then(()=>{

            status.textContent =
                "● البث يعمل";

        })
        .catch(()=>{

            status.textContent =
                "اضغط ▶ لتشغيل البث";

        });

    }

    else{

        status.textContent =
            "المتصفح لا يدعم HLS";

    }

}
