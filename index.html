<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images to PDF Converter</title>  <!-- jsPDF عبر HTTPS -->  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --success-color: #10b981;
      --success-hover: #059669;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,.05);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    header p {
      color: #64748b;
      font-size: .95rem;
    }

    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      transition: .3s;
      background: #fafafa;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--primary-color);
      background: #eff6ff;
    }

    .drop-zone-content svg {
      stroke: var(--primary-color);
      margin-bottom: 10px;
    }

    .drop-zone-content p span {
      color: var(--primary-color);
      font-weight: 600;
    }

    .file-list {
      list-style: none;
      margin-top: 20px;
      max-height: 220px;
      overflow-y: auto;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #f1f5f9;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: .9rem;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary-btn {
      background: var(--primary-color);
      color: white;
    }

    .primary-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .success-btn {
      background: var(--success-color);
      color: white;
    }

    .success-btn:hover:not(:disabled) {
      background: var(--success-hover);
    }

    .secondary-btn {
      background: #e2e8f0;
      color: #475569;
    }

    .secondary-btn:hover:not(:disabled) {
      background: #cbd5e1;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .preview-container {
      margin-top: 30px;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .preview-header h2 {
      font-size: 1.2rem;
    }

    .embed-wrapper {
      width: 100%;
      height: 550px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
    }

    embed {
      width: 100%;
      height: 100%;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      color: #64748b;
      font-size: .9rem;
    }
  </style></head><body><div class="container">  <header>
    <h1>Images to PDF Converter</h1>
    <p>Convert your images into a single PDF document instantly.</p>
  </header>  <div class="drop-zone" id="dropZone"><input
  type="file"
  id="fileInput"
  multiple
  accept="image/*"
  hidden
>

<div class="drop-zone-content">

  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="48"
    height="48"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">

    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>

  </svg>

  <p>
    Drag & Drop images here or
    <span>Browse</span>
  </p>

</div>

  </div>  <ul class="file-list" id="fileList"></ul>  <div class="actions"><button
  id="convertBtn"
  class="btn primary-btn"
  disabled>
  Convert to PDF
</button>

<button
  id="clearBtn"
  class="btn secondary-btn"
  disabled>
  Clear All
</button>

  </div>  <div
    id="status"
    class="status">
  </div>  <div
    class="preview-container"
    id="previewContainer"
    style="display:none;"><div class="preview-header">

  <h2>PDF Preview</h2>

  <button
    id="downloadBtn"
    class="btn success-btn"
    style="flex:initial;padding:8px 16px;">

    Download PDF

  </button>

</div>

<div
  class="embed-wrapper"
  id="previewWrapper">
</div>

  </div></div><script>

"use strict";

const { jsPDF } = window.jspdf;

const dropZone =
  document.getElementById("dropZone");

const fileInput =
  document.getElementById("fileInput");

const fileList =
  document.getElementById("fileList");

const convertBtn =
  document.getElementById("convertBtn");

const clearBtn =
  document.getElementById("clearBtn");

const downloadBtn =
  document.getElementById("downloadBtn");

const previewContainer =
  document.getElementById("previewContainer");

const previewWrapper =
  document.getElementById("previewWrapper");

const status =
  document.getElementById("status");

let selectedFiles = [];

let pdfDoc = null;

let pdfBlob = null;


/* =========================
   اختيار الصور
========================= */

dropZone.addEventListener("click", () => {

  fileInput.click();

});


fileInput.addEventListener("change", event => {

  handleFiles(event.target.files);

});


/* =========================
   Drag & Drop
========================= */

dropZone.addEventListener("dragover", event => {

  event.preventDefault();

  dropZone.classList.add("dragover");

});


dropZone.addEventListener("dragleave", () => {

  dropZone.classList.remove("dragover");

});


dropZone.addEventListener("drop", event => {

  event.preventDefault();

  dropZone.classList.remove("dragover");

  handleFiles(event.dataTransfer.files);

});


/* =========================
   معالجة الملفات
========================= */

function handleFiles(files) {

  const images =
    Array.from(files).filter(file =>
      file.type.startsWith("image/")
    );

  if (!images.length) {

    status.textContent =
      "Please select image files.";

    return;
  }

  selectedFiles =
    [...selectedFiles, ...images];

  status.textContent = "";

  updateUI();

}


/* =========================
   تحديث القائمة
========================= */

function updateUI() {

  fileList.innerHTML = "";

  selectedFiles.forEach((file, index) => {

    const li =
      document.createElement("li");

    li.className = "file-item";

    const name =
      document.createElement("span");

    name.textContent =
      `${index + 1}. ${file.name}`;

    const size =
      document.createElement("small");

    size.textContent =
      `${(file.size / 1024).toFixed(1)} KB`;

    li.appendChild(name);
    li.appendChild(size);

    fileList.appendChild(li);

  });

  const hasFiles =
    selectedFiles.length > 0;

  convertBtn.disabled =
    !hasFiles;

  clearBtn.disabled =
    !hasFiles;

}


/* =========================
   مسح الكل
========================= */

clearBtn.addEventListener("click", () => {

  selectedFiles = [];

  fileInput.value = "";

  pdfDoc = null;

  pdfBlob = null;

  previewContainer.style.display =
    "none";

  previewWrapper.innerHTML = "";

  status.textContent = "";

  updateUI();

});


/* =========================
   تحويل الصور إلى PDF
========================= */

convertBtn.addEventListener("click", async () => {

  if (!selectedFiles.length)
    return;

  try {

    convertBtn.disabled = true;

    convertBtn.textContent =
      "Processing...";

    status.textContent =
      "Creating PDF...";

    pdfDoc = new jsPDF({
      orientation: "portrait",
      unit: "mm",
      format: "a4",
      compress: true
    });


    for (
      let i = 0;
      i < selectedFiles.length;
      i++
    ) {

      const file =
        selectedFiles[i];

      status.textContent =
        `Processing image ${i + 1} of ${selectedFiles.length}...`;

      const imageData =
        await readFileAsDataURL(file);

      const imgProps =
        await getImageProperties(imageData);

      const pageWidth =
        pdfDoc.internal.pageSize.getWidth();

      const pageHeight =
        pdfDoc.internal.pageSize.getHeight();


      let imgWidth =
        pageWidth;

      let imgHeight =
        (imgProps.height * pageWidth) /
        imgProps.width;


      if (imgHeight > pageHeight) {

        imgHeight =
          pageHeight;

        imgWidth =
          (imgProps.width * pageHeight) /
          imgProps.height;

      }


      const xOffset =
        (pageWidth - imgWidth) / 2;

      const yOffset =
        (pageHeight - imgHeight) / 2;


      if (i > 0) {

        pdfDoc.addPage();

      }


      pdfDoc.addImage(
        imageData,
        imgProps.format,
        xOffset,
        yOffset,
        imgWidth,
        imgHeight,
        undefined,
        "FAST"
      );

    }


    /* =========================
       إنشاء Blob
    ========================= */

    pdfBlob =
      pdfDoc.output("blob");


    /* =========================
       إنشاء Preview
    ========================= */

    const previewUrl =
      URL.createObjectURL(pdfBlob);


    previewWrapper.innerHTML = "";

    const embed =
      document.createElement("embed");

    embed.src =
      previewUrl;

    embed.type =
      "application/pdf";

    embed.style.width =
      "100%";

    embed.style.height =
      "100%";

    previewWrapper.appendChild(embed);

    previewContainer.style.display =
      "block";


    status.textContent =
      "PDF created successfully.";

  } catch (error) {

    console.error(error);

    status.textContent =
      "Error creating PDF: " +
      error.message;

  } finally {

    convertBtn.textContent =
      "Convert to PDF";

    convertBtn.disabled =
      selectedFiles.length === 0;

  }

});


/* =========================
   HTTPS / Blob Download
========================= */

downloadBtn.addEventListener("click", async () => {

  if (!pdfBlob) {

    status.textContent =
      "Please create the PDF first.";

    return;

  }


  try {

    status.textContent =
      "Preparing download...";


    /*
      إنشاء Blob URL
      بدلاً من pdfDoc.save()
    */

    const blobUrl =
      URL.createObjectURL(pdfBlob);


    const link =
      document.createElement("a");

    link.href =
      blobUrl;

    link.download =
      "converted-images.pdf";

    link.style.display =
      "none";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);


    setTimeout(() => {

      URL.revokeObjectURL(blobUrl);

    }, 5000);


    status.textContent =
      "Download started.";

  } catch (error) {

    console.error(error);

    status.textContent =
      "Unable to download PDF: " +
      error.message;

  }

});


/* =========================
   FileReader
========================= */

function readFileAsDataURL(file) {

  return new Promise((resolve, reject) => {

    const reader =
      new FileReader();

    reader.onload =
      () => resolve(reader.result);

    reader.onerror =
      () => reject(
        new Error("Unable to read image.")
      );

    reader.readAsDataURL(file);

  });

}


/* =========================
   Image Properties
========================= */

function getImageProperties(dataUrl) {

  return new Promise((resolve, reject) => {

    const img =
      new Image();

    img.onload = () => {

      let format = "JPEG";

      if (
        dataUrl.startsWith(
          "data:image/png"
        )
      ) {

        format = "PNG";

      } else if (
        dataUrl.startsWith(
          "data:image/webp"
        )
      ) {

        /*
          jsPDF قد لا يعمل مع WEBP
          في بعض WebViews.
          نحوله إلى JPEG.
        */

        format = "JPEG";

      }


      resolve({

        width: img.width,

        height: img.height,

        format: format

      });

    };


    img.onerror = () => {

      reject(
        new Error("Unable to load image.")
      );

    };


    img.src = dataUrl;

  });

}

</script></body>
  </html>
