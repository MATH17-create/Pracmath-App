<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images to PDF Converter</title>
  <!-- jsPDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --success-color: #10b981;
      --success-hover: #059669;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    header p {
      color: #64748b;
      font-size: 0.95rem;
    }

    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background-color: #fafafa;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--primary-color);
      background-color: #eff6ff;
    }

    .drop-zone-content svg {
      stroke: var(--primary-color);
      margin-bottom: 10px;
    }

    .drop-zone-content p span {
      color: var(--primary-color);
      font-weight: 600;
    }

    .file-list {
      list-style: none;
      margin-top: 20px;
      max-height: 220px;
      overflow-y: auto;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background-color: #f1f5f9;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary-btn {
      background-color: var(--primary-color);
      color: white;
    }

    .primary-btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .success-btn {
      background-color: var(--success-color);
      color: white;
    }

    .success-btn:hover:not(:disabled) {
      background-color: var(--success-hover);
    }

    .secondary-btn {
      background-color: #e2e8f0;
      color: #475569;
    }

    .secondary-btn:hover:not(:disabled) {
      background-color: #cbd5e1;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .preview-container {
      margin-top: 30px;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .preview-header h2 {
      font-size: 1.2rem;
    }

    .embed-wrapper {
      width: 100%;
      height: 550px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
    }

    embed, object {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Images to PDF Converter</h1>
      <p>Convert your images into a single PDF document instantly.</p>
    </header>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" multiple accept="image/*" hidden>
      <div class="drop-zone-content">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p>Drag & Drop images here or <span>Browse</span></p>
      </div>
    </div>

    <ul class="file-list" id="fileList"></ul>

    <div class="actions">
      <button id="convertBtn" class="btn primary-btn" disabled>Convert to PDF</button>
      <button id="clearBtn" class="btn secondary-btn" disabled>Clear All</button>
    </div>

    <div class="preview-container" id="previewContainer" style="display: none;">
      <div class="preview-header">
        <h2>PDF Preview</h2>
        <button id="downloadBtn" class="btn success-btn" style="flex: initial; padding: 8px 16px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download PDF
        </button>
      </div>
      <div class="embed-wrapper" id="previewWrapper"></div>
    </div>
  </div>

  <script>
    const { jsPDF } = window.jspdf;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const convertBtn = document.getElementById('convertBtn');
    const clearBtn = document.getElementById('clearBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewContainer = document.getElementById('previewContainer');
    const previewWrapper = document.getElementById('previewWrapper');

    let selectedFiles = [];
    let pdfDoc = null; // Store current generated jsPDF instance

    // Drag & Drop Handling
    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
      const images = Array.from(files).filter(file => file.type.startsWith('image/'));
      selectedFiles = [...selectedFiles, ...images];
      updateUI();
    }

    function updateUI() {
      fileList.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        const li = document.createElement('li');
        li.className = 'file-item';
        li.innerHTML = `
          <span>${index + 1}. ${file.name}</span>
          <small>${(file.size / 1024).toFixed(1)} KB</small>
        `;
        fileList.appendChild(li);
      });

      const hasFiles = selectedFiles.length > 0;
      convertBtn.disabled = !hasFiles;
      clearBtn.disabled = !hasFiles;
    }

    clearBtn.addEventListener('click', () => {
      selectedFiles = [];
      fileInput.value = '';
      previewContainer.style.display = 'none';
      previewWrapper.innerHTML = '';
      pdfDoc = null;
      updateUI();
    });

    // Convert Images to PDF
    convertBtn.addEventListener('click', async () => {
      if (selectedFiles.length === 0) return;

      convertBtn.textContent = 'Processing...';
      convertBtn.disabled = true;

      pdfDoc = new jsPDF();

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        const imageData = await readFileAsDataURL(file);
        const imgProps = await getImageProperties(imageData);

        const pageWidth = pdfDoc.internal.pageSize.getWidth();
        const pageHeight = pdfDoc.internal.pageSize.getHeight();
        
        let imgWidth = pageWidth;
        let imgHeight = (imgProps.height * pageWidth) / imgProps.width;

        if (imgHeight > pageHeight) {
          imgHeight = pageHeight;
          imgWidth = (imgProps.width * pageHeight) / imgProps.height;
        }

        const xOffset = (pageWidth - imgWidth) / 2;
        const yOffset = (pageHeight - imgHeight) / 2;

        if (i > 0) pdfDoc.addPage();
        pdfDoc.addImage(imageData, imgProps.format, xOffset, yOffset, imgWidth, imgHeight);
      }

      // Generate Data URL for Preview (Most compatible method across modern browsers)
      const pdfDataUrl = pdfDoc.output('datauristring');
      previewWrapper.innerHTML = `<embed src="${pdfDataUrl}" type="application/pdf">`;
      previewContainer.style.display = 'block';

      convertBtn.textContent = 'Convert to PDF';
      convertBtn.disabled = false;
    });

    // Download Button Handler
    downloadBtn.addEventListener('click', () => {
      if (pdfDoc) {
        pdfDoc.save('converted-images.pdf');
      }
    });

    // Helper Functions
    function readFileAsDataURL(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    function getImageProperties(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let format = 'JPEG';
          if (dataUrl.startsWith('data:image/png')) format = 'PNG';
          if (dataUrl.startsWith('data:image/webp')) format = 'WEBP';
          
          resolve({
            width: img.width,
            height: img.height,
            format: format
          });
        };
        img.src = dataUrl;
      });
    }
  </script>
</body>
</html>
