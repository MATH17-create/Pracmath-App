<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1565c0">
<title>PracMath</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#18212f;--muted:#667085;--primary:#1976d2;--border:#d9e1ec;--result:#eef6ff;--danger:#d32f2f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;transition:.25s}
body.dark{--bg:#0f1720;--card:#18222d;--text:#f4f7fb;--muted:#aab6c5;--primary:#64b5f6;--border:#334252;--result:#142a40}
.app{width:min(760px,100%);margin:auto;padding:12px}
header{height:52px;display:flex;align-items:center;justify-content:space-between}
.title{font:700 23px Georgia,serif}
.subtitle{font-size:11px;color:var(--muted)}
.theme{border:0;background:var(--card);color:var(--text);border-radius:50%;width:42px;height:42px;font-size:21px;box-shadow:0 2px 10px #0002}
.actions button {
    cursor: pointer;
}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 5px 18px #0000000d}
#problem{min-height:230px;background:var(--result);border-radius:14px;padding:18px;display:flex;align-items:center;justify-content:center;
  overflow:auto;
  font-weight: 600;
}
#problem,
#problem * {
    font-family: "Times New Roman", Times, serif !important;
    font-weight: bold !important;
}
.math{font:22px "Courier New",monospace;line-height:1.35;white-space:pre;text-align:right}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.control label{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;margin-bottom:8px}
.value{color:var(--primary)}
input[type=range]{width:100%;accent-color:var(--primary)}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.op{border:1px solid var(--border);border-radius:12px;padding:11px;cursor:pointer}
.op:has(input:checked){border-color:var(--primary);background:#1976d20d}
.op input{accent-color:var(--primary)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.action{border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:bold;background:var(--primary);color:white}
button.secondary{background:transparent;color:var(--primary);border:1px solid var(--primary)}
button:disabled{opacity:.45}
.status{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.hidden{display:none}
@media(max-width:430px){.math{font-size:19px}.controls{gap:8px}.actions{grid-template-columns:1fr}.card{padding:13px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div><div class="title">PracMath</div><div class="subtitle">Math practice generator</div></div>
 <button class="theme" id="themeBtn" onclick="toggleTheme()" aria-label="Theme">🔆</button>
</header>

<section class="card">
 <div id="problem"><div class="math" id="math"></div></div>
</section>

<section class="card">
 <div class="actions">
  <button class="action" onclick="generate(false)">توليد العملية</button>
  <button class="action secondary" id="blankBtn" onclick="animateBlanks()">توليد بالفراغ</button>
 </div>
</section>

<section class="card">
 <div class="controls">
  <div class="control">
   <label>عدد الأرقام <span class="value" id="colValue">3</span></label>
   <input id="columns" type="range" min="2" max="8" value="3">
  </div>
  <div class="control">
   <label>عدد الطبقات  <span class="value" id="rowValue">2</span></label>
   <input id="rows" type="range" min="2" max="4" value="2">
  </div>
 </div>
</section>

<section class="card">
  <div class="ops">
    <label class="op">
      <input type="radio" name="op" value="add" checked
             >
      الجمع +
    </label>

    <label class="op">
      <input type="radio" name="op" value="sub"
             >
      الطرح −
    </label>

    <label class="op">
      <input type="radio" name="op" value="mul"
            >
      الضرب ×
    </label>

    <label class="op">
      <input type="radio" name="op" value="div"
             >
      القسمة ÷
    </label>
  </div>
</section>

<section class="card status">
 <span id="info">Ready</span><span>PracMath</span>
</section>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const digits=n=>String(Math.max(0,Math.trunc(n)));
let lastProblem=null;

function getOp(){return document.querySelector('input[name="op"]:checked').value}
function getColumns(){return +$("columns").value}
function getRows(){return +$("rows").value}

function makeNumber(d){
 const min=10**(d-1),max=10**d-1;
 return rand(min,max);
}
function spaced(n){return String(n).split("").join("  ")}
function line(n){return "—".repeat(Math.max(4,String(Math.abs(n)).length*1))}
function show(text){$("math").textContent=text;lastProblem=text}

function replaceRandomDigits(value, count=3, min=0, max=9){
 let s=String(value);
 const ds=Array.from({length:count},()=>rand(min,max));
 for(const d of ds)s=s.split(String(d)).join("_");
 return s;
}

function validSubtractionNumbers(d,rows){
 let first=makeNumber(d), values=[first];
 for(let i=1;i<rows;i++){
   let max=Math.max(1,Math.floor(values[i-1]/2));
   let min=Math.max(1,10**(d-1));
   if(min>max)min=1;
   values.push(rand(min,max));
 }
 return values;
}

function addition(blanks=false){
 const d=getColumns(),r=getRows(),v=Array.from({length:r},()=>makeNumber(d));
 const total=v.reduce((a,b)=>a+b,0);
 let out=v.map((n,i)=>(i?"+ ":"  ")+(blanks?spaced(replaceRandomDigits(n)):spaced(n)));
 out.push(line(total));
 if(blanks)out.push(spaced(replaceRandomDigits(total)));
 show(out.join("\n"));
 $("info").textContent=`Addition • ${d} digits • ${r} rows`;
}

function subtraction(blanks=false){
 const d=getColumns(),r=getRows(),v=validSubtractionNumbers(d,r);
 const total=v.slice(1).reduce((a,b)=>a-b,v[0]);
 let out=v.map((n,i)=>(i?"- ":"  ")+(blanks?spaced(replaceRandomDigits(n)):spaced(n)));
 out.push(line(v[0]));
 if(blanks)out.push(spaced(replaceRandomDigits(total)));
 show(out.join("\n"));
 $("info").textContent=`Subtraction • ${d} digits • ${r} rows`;
}

function multiplication(blanks=false){
 const d=getColumns();
 const a=makeNumber(d),b=rand(2,Math.max(2,10**Math.min(d-1,3)-1));
 const result=a*b;
 let out=[spaced(blanks?replaceRandomDigits(a):a),
          "× "+spaced(blanks?replaceRandomDigits(b,2,1,9):b),
          line(result)];
 if(blanks){
   for(let i=0;i<String(b).length;i++){
     const part=Number(String(b)[String(b).length-1-i])*a*10**i;
     out.push(spaced(replaceRandomDigits(part,2,1,9)));
   }
   out.push(line(result));
   out.push(spaced(replaceRandomDigits(result,3,1,9)));
 }
 show(out.join("\n"));
 $("info").textContent=`Multiplication • ${d} digits`;
 $("columns").dispatchEvent(new Event("input"));
}

function division(blanks=false){
 const d=getColumns();
 let divisor=rand(2,Math.max(2,10**Math.min(d-1,3)-1));
 let quotient=rand(10**(d-1),10**d-1);
 let dividend=divisor*quotient;
 let out=`${spaced(dividend)} ÷ ${spaced(divisor)}`;
 if(blanks)out+=`\n\nQuotient: ${replaceRandomDigits(quotient,2,0,9)}`;
 show(out);
 $("info").textContent=`Division • exact division`;
}

function generate(blanks=false){
 const op=getOp();
 if(op==="add")addition(blanks);
 if(op==="sub")subtraction(blanks);
 if(op==="mul")multiplication(blanks);
 if(op==="div")division(blanks);
}

function animateBlanks(){
 const p=$("math"),btn=$("blankBtn");
 btn.disabled=true;
 p.style.transition="transform .18s,opacity .18s";
 p.style.transform="scale(.7)";
 p.style.opacity=".2";
 setTimeout(()=>{p.textContent="•";p.style.transform="scale(1.3)";p.style.opacity="1"},180);
 setTimeout(()=>{generate(true);p.style.transform="scale(1)"},500);
 setTimeout(()=>btn.disabled=false,700);
}

function updateUI(){
 const op=getOp(),d=getColumns();
 $("colValue").textContent=d;
 $("rowValue").textContent=getRows();
 $("rows").disabled=op==="mul"||op==="div";
 $("blankBtn").disabled=false;
 if(op==="div")$("blankBtn").disabled=true;
 if(op==="mul")$("rows").value=2;
 if(op==="div")$("rows").value=2;
 $("rowValue").textContent=$("rows").value;
}

$("columns").oninput=()=>{updateUI();generate(false)}
$("rows").oninput=()=>{updateUI();generate(false)}
document.querySelectorAll('input[name="op"]').forEach(x=>x.onchange=()=>{updateUI();generate(false)});

function toggleTheme(){
 document.body.classList.toggle("dark");
 const dark=document.body.classList.contains("dark");
 $("themeBtn").textContent=dark?"🔆":"🌙";
 localStorage.setItem("pracmath-theme",dark?"dark":"light");
}
if(localStorage.getItem("pracmath-theme")==="dark"){
 document.body.classList.add("dark");$("themeBtn").textContent="🔆";
}
let refreshCount = Number(sessionStorage.getItem("refreshCount") || 0);

if (refreshCount < 3) {
    refreshCount++;
    sessionStorage.setItem("refreshCount", refreshCount);

    setTimeout(() => {
        location.reload();
    }, 500);
} else {
    sessionStorage.removeItem("refreshCount");
}
updateUI();
generate(false);
</script>
</body>
</html>
