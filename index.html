<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0">

<title> </title>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* =========================
   BODY
========================= */

body{
    background:#0b0d12;
    color:#fff;
    font-family:Arial, sans-serif;
}


/* =========================
   HEADER
========================= */

.header{
    height:70px;

    background:#11151d;

    display:flex;
    align-items:center;

    padding:0 16px;

    position:sticky;
    top:0;

    z-index:10;

    border-bottom:1px solid #3b321d;
}

.back{
    font-size:36px;
    margin-left:18px;
    color:#d4af37;

    line-height:1;
}

.title{
    font-size:22px;
    font-weight:bold;

    flex:1;

    color:#fff;
}


/* =========================
   GOLD DOT
========================= */

.dot{
    width:8px;
    height:8px;

    display:inline-block;

    background:#d4af37;

    border-radius:50%;

    margin-right:5px;

    box-shadow:
        0 0 6px #d4af37,
        0 0 12px #d4af37;
}


/* =========================
   MAIN
========================= */

.container{
    padding:14px 10px 30px;
}


/* =========================
   SECTION TITLE
========================= */

.section-title{
    font-size:19px;

    font-weight:bold;

    margin:8px 4px 14px;

    color:#d4af37;
}


/* =========================
   CHANNEL GRID
========================= */

.channels{
    display:grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:12px;
}


/* =========================
   CHANNEL CARD
========================= */

.channel{
    background:#171b23;

    border:1px solid #292f3a;

    border-radius:12px;

    overflow:hidden;

    text-decoration:none;

    color:#fff;

    box-shadow:
        0 4px 12px rgba(0,0,0,.35);

    transition:
        transform .15s,
        background .15s,
        border-color .15s;
}

.channel:hover{
    background:#1d222c;

    border-color:#d4af37;
}

.channel:active{
    transform:scale(.96);
}


/* =========================
   LOGO BOX
========================= */

.logo-box{
    height:115px;

    background:#fff;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:12px;

    position:relative;
}


/* =========================
   PNG LOGOS
========================= */

.logo-box img{
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;
}


/* =========================
   CHANNEL NUMBER
========================= */

.number{
    position:absolute;

    top:8px;
    right:8px;

    min-width:31px;
    height:31px;

    padding:0 7px;

    background:#b8962e;

    color:#fff;

    border-radius:6px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:17px;

    font-weight:bold;

    box-shadow:
        0 0 8px rgba(212,175,55,.45);
}


/* =========================
   CHANNEL NAME
========================= */

.name{
    min-height:52px;

    display:flex;

    align-items:center;

    padding:8px 10px;

    font-size:14px;

    color:#d5d8de;

    line-height:1.3;
}


/* =========================
   ONLINE INDICATOR
========================= */

.online{
    width:7px;
    height:7px;

    background:#d4af37;

    border-radius:50%;

    display:inline-block;

    margin-left:7px;

    flex-shrink:0;

    box-shadow:
        0 0 7px #d4af37,
        0 0 12px rgba(212,175,55,.6);
}


/* =========================
   TABLET
========================= */

@media (min-width:600px){

    .channels{
        grid-template-columns:
            repeat(4, 1fr);
    }

    .logo-box{
        height:140px;
    }

}


/* =========================
   DESKTOP
========================= */

@media (min-width:1000px){

    .container{
        max-width:1100px;

        margin:auto;
    }

    .channels{
        grid-template-columns:
            repeat(5, 1fr);
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="back"></div>

    <div class="title">

        aljazeera live

</html>
